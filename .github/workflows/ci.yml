name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest toolchain the go command can install plus the current release: the module
        # declares "go 1.20" so consumers on older toolchains can upgrade with a plain bump.
        go: ["1.21.x", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go.mod is tidy and keeps the go 1.20 floor
        if: matrix.go == 'stable'
        run: |
          go mod tidy -go=1.20
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 -cover ./...
